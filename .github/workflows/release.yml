name: Release Widget (OpenWigiDash)

# Branch net10: versões 2.x para o OpenWigiDashManager. Uma tag v2* (ex.: v2.0.0-preview.1) gera:
# - o pacote de plugin no nuget.org (victorperez2911.OpenWigiDash.Discord), que o Manager instala;
# - o zip na release do GitHub, para quem instala à mão.
# A versão do pacote é a da tag sem o "v". Publica por Trusted Publishing (sem chave guardada):
# a política no nuget.org aponta para este repositório e este workflow, e vars.NUGET_USER é o usuário.
on:
  push:
    tags:
      - 'v2*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      WIDGET_NAME: "DiscordWidget"
      CONFIGURATION: "Release"

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

    - name: Test
      run: dotnet test tests/DiscordWidget.Tests -c ${{ env.CONFIGURATION }}

    - name: Pack
      run: dotnet pack DiscordWidget.csproj -c ${{ env.CONFIGURATION }} -o nupkgs /p:Version=${{ env.PACKAGE_VERSION }}

    - name: Publish
      run: dotnet publish DiscordWidget.csproj -c ${{ env.CONFIGURATION }} -o dist/${{ env.WIDGET_NAME }} /p:Version=${{ env.PACKAGE_VERSION }}

    - name: Zip
      shell: pwsh
      run: |
        $zipName = "OpenWigiDash-DiscordWidget-${{ github.ref_name }}.zip"
        Get-ChildItem "dist\${{ env.WIDGET_NAME }}" | ForEach-Object { Write-Host "  - $($_.Name)" }
        Compress-Archive -Path "dist\${{ env.WIDGET_NAME }}" -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: nuget
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to nuget.org
      shell: pwsh
      # No runner Windows o curinga não chega expandido ao dotnet: um push por arquivo.
      run: |
        Get-ChildItem nupkgs -Filter *.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_NAME }}
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
