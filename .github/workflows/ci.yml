name: CI

# Build e testes em cada PR para o net10 (e nos PRs empilhados em cima dele).
on:
  pull_request:
  push:
    branches: [net10]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test tests/DiscordWidget.Tests
